<?xml version="1.0" encoding="UTF-8"?>
<!--
  The JADEITE application icon.

  The same faceted cabochon as src/renderer/src/shell/JadeGlyph.tsx, drawn on
  the same 24-unit grid so the two cannot drift apart, and painted once in a
  fixed jade rather than from a palette token. That difference is not an
  oversight: a window manager's task list and a launcher grid are outside the
  application, where no CSS custom property has been declared and where the
  owner's chosen palette has no standing at all. The in-app glyph follows the
  palette because it lives inside §12.3; this one cannot, so it settles on the
  stone's own colour.

  A backing plate rather than a bare silhouette. A transparent gem disappears
  against a dark panel in half the desktop themes it will land on, and an icon
  that vanishes is worse than one that does not match.

  build/icon.png is rasterised from this file and committed beside it, because
  the packaging step must not depend on rsvg-convert or ImageMagick being
  installed on whichever machine cuts the next release:

      rsvg-convert -w 512 -h 512 build/icon.svg -o build/icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512">
  <rect width="24" height="24" rx="5.2" fill="#0E1A16"/>

  <!-- The body of the stone. -->
  <path d="M12 2.6 L18.6 5.4 L21.4 12 L18.6 18.6 L12 21.4 L5.4 18.6 L2.6 12 L5.4 5.4 Z"
        fill="#3E9C77" stroke="#8FD9BA" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- The table facet, the one bright note. -->
  <path d="M12 7.7 L15.05 9 L16.3 12 L15.05 15 L12 16.3 L8.95 15 L7.7 12 L8.95 9 Z"
        fill="#6FC9A2"/>

  <!-- The four crown facets. -->
  <g stroke="#C7EEDC" stroke-width="0.5" stroke-linecap="round" opacity="0.55">
    <path d="M18.6 5.4 L15.05 9"/>
    <path d="M18.6 18.6 L15.05 15"/>
    <path d="M5.4 18.6 L8.95 15"/>
    <path d="M5.4 5.4 L8.95 9"/>
  </g>
</svg>
