# The Linux packages, built where Linux packages have to be built.
#
# `package.json`'s `//package:win` note explains the rule this file is the
# other half of: a native binary must be packed on the platform it targets,
# because `node-gyp-build` and `bindings` both resolve whatever already sits
# in `build/Release` ahead of any prebuild, and a foreign object sealed inside
# a package fails only at first unlock — after the vault UI has already
# painted, on a machine the build never saw. `npm run package` here runs
# `install-app-deps` as an ordinary part of `npm install`, unlike
# `package:win`, because Linux is the one platform where that rebuild has not
# already happened by the time `npm ci` finishes: better-sqlite3-multiple-
# ciphers is not N-API, so npm's own install step fetches the Node-ABI
# prebuild, and only `install-app-deps` replaces it with the Electron one.
# `npm ci` is therefore not allowed to fail quietly the way it is in
# `windows-build.yml` — there is no later step here that re-checks the
# binaries the way that workflow's own does, and a swallowed failure would
# mean a packaged application that opens and then fails at first unlock.
#
# Two targets come out of one build — `.pacman` and `.deb`, per
# `electron-builder.yml`'s `linux.target`, which used to name a third and says
# there why the `.tar.gz` was dropped — and no system package (fpm, dpkg, rpm)
# needs installing first: electron-builder carries its own fpm binary.
#
# A third artefact is made in the job after it. `archpkg` re-packages the
# `.pacman` into `jadeite-<version>-1-x86_64.pkg.tar.zst` with makepkg, out of
# `build/package/PKGBUILD`, and it is a separate job for one reason: makepkg is
# Arch's and this runner is Ubuntu, so it needs a container. It builds nothing —
# its whole input is the artefact the job above uploaded.
# Nothing here reports anywhere, the same as `windows-build.yml`'s own note on
# that: the two network dependencies are the ones building has always had,
# npm fetching the dependency tree and electron-builder fetching Electron
# 42.9.0 into the runner's cache.
name: Linux packages

# The same two doors as `windows-build.yml`, for the same reason: a pushed
# `v*` tag is the ordinary route, `workflow_dispatch` is the manual one from
# the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Nothing by default, matching `windows-build.yml`: every job names what it
# needs, and only the release job below ever holds a token that can write to
# the repository.
permissions: {}

jobs:
  build:
    name: Pack the installers on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Generous for the same reason as the Windows job: a fresh runner has a
    # cold dependency tree, a cold Electron distribution, and may compile
    # better-sqlite3-multiple-ciphers from source during `install-app-deps`
    # rather than finding a prebuild, which an ordinary run does not pay for.
    timeout-minutes: 60

    steps:
      - name: Check out the commit being packed
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Allowed to fail loudly, unlike the Windows workflow's own install
      # step — see the file-level comment above for why the two differ here.
      - name: Install the dependency tree
        run: npm ci

      # Electron 42 stopped downloading its own binary during `npm install`;
      # this also warms the same cache electron-builder reads when it
      # assembles the package, so the distribution comes down once.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      # electron-builder's bundled fpm shells out to `bsdtar` to write a
      # pacman package's .MTREE metadata, and ubuntu-latest carries only GNU
      # tar — this step found that out by failing with exit 127 the first
      # time this workflow ran. Debian and Ubuntu ship the binary itself
      # under a differently-named package, `libarchive-tools`, rather than
      # one called `bsdtar`.
      - name: Install bsdtar, which the pacman target shells out to
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      # `package` verbatim: `npm run build && electron-builder --linux`, and
      # `build` itself runs `npm run audit` first — so this step also
      # re-proves the four build-gate scripts against the exact commit being
      # packed, not just whatever last passed on a contributor's machine.
      # What it does not run is the same thing `windows-build.yml` names for
      # its own build step: the unit suites and `verify:package` are outside
      # it, because the packaged Playwright suite wants a real desktop
      # session. This workflow builds the artefacts; it does not certify them.
      - name: Pack the installers
        run: npm run package

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          # Globs, matching `windows-build.yml`'s own reasoning: `${version}`
          # here is package.json's semver, and it need not be spelled out for
          # the workflow to find what packaging just produced.
          path: |
            release/*.pacman
            release/*.deb
          if-no-files-found: error

  archpkg:
    name: Re-pack the pacman package the Arch way
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Minutes, not the hour the job above wants: nothing is fetched, compiled or
    # rebuilt here. The work is one bsdtar extraction of a 331 MB payload and one
    # zstd pass back over it, which takes about twenty seconds on a laptop.
    timeout-minutes: 20
    # The one job that cannot run on the runner itself. makepkg and pacman are
    # Arch's and `ubuntu-latest` has neither, so the packaging happens in Arch's
    # own image. `base-devel` is the group Arch itself calls a build environment:
    # what this job actually needs out of it is `fakeroot`, which makepkg refuses
    # to package without, and `git`, which `actions/checkout` prefers. `bsdtar`,
    # which package() unpacks the `.pacman` with, is libarchive's and comes from
    # `base` underneath.
    container: archlinux:base-devel

    steps:
      - name: Check out the commit being packed
        uses: actions/checkout@v7

      # Into `release/`, which is exactly where the PKGBUILD's `SRCDEST` is
      # pointed below, so makepkg finds `jadeite-<version>.pacman` already
      # present and fetches nothing. This step is the whole of this job's input;
      # the `.deb` rides along in the same artefact and is ignored.
      - name: Collect the pacman package the build job made
        uses: actions/download-artifact@v7
        with:
          name: linux-packages
          path: release

      # The one way this job can finish green and be wrong, so it is asserted
      # rather than trusted.
      #
      # makepkg resolves its source by filename. If `pkgver` in the PKGBUILD has
      # not been moved to the version being released, the
      # `jadeite-<pkgver>.pacman` it wants is not the file the build job just
      # uploaded and is not in `release/` at all — so makepkg falls back to the
      # `source` URL, downloads the **previous** release's asset, and packages
      # that. Its sha256 would even pass, because that is the artefact the line
      # pins. The result is a release whose Arch package contains the version
      # before it, with nothing anywhere saying so.
      #
      # `pacman -Qip` below cannot catch it either: what it reads back would be
      # a perfectly valid package of the wrong version.
      - name: Refuse to package a version this run did not build
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' build/package/PKGBUILD)
          if [ ! -f "release/jadeite-$pkgver.pacman" ]; then
            echo "build/package/PKGBUILD says pkgver=$pkgver, but that is not what the build job produced:"
            ls -1 release/
            echo
            echo "Move pkgver, _tag and sha256sums in build/package/PKGBUILD to the version being released."
            echo "Left alone, makepkg would fetch and package the previous release instead."
            exit 1
          fi
          echo "pkgver=$pkgver, and release/jadeite-$pkgver.pacman is the artefact this run built."

      # makepkg refuses to run as root, and a container is root — so the build
      # needs somebody to be. `--login` rather than a bare `su` so the shell gets
      # a real `HOME`; the workspace path is expanded by root's shell before `su`
      # ever sees it.
      #
      # The four flags are the same four `npm run package:arch` passes, and
      # `package.json`'s `//package:arch` explains each at length: `--nodeps`
      # because nothing is compiled here and this container has no gtk3,
      # `--skipchecksums` because the PKGBUILD's sha256 pins the *published*
      # artefact and this is the one built in the job above, `--clean` and
      # `--force` for a runner that starts empty and must not stop to ask.
      - name: Build the package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder --login -c "cd '$GITHUB_WORKSPACE/build/package' && PACKAGER='sudo-megas <halil@namli.xyz>' SRCDEST=../../release PKGDEST=../../release makepkg --force --clean --nodeps --skipchecksums --noconfirm"

      # Proof rather than ceremony, and cheap: `pacman -Qip` parses the package
      # the way an install would and prints what it will claim of the system.
      # A package that cannot be read back has failed even though makepkg exited
      # zero, and this is the only place in the pipeline that can notice.
      - name: Read the finished package back
        run: pacman -Qip release/*.pkg.tar.zst

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: release/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Attach the installers to the release
    needs: [build, archpkg]
    # Only where there is a tag to attach to — a `workflow_dispatch` from a
    # branch builds and stops at the artefact above, the same shape
    # `windows-build.yml` uses for a trial run.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Collect the installers
        uses: actions/download-artifact@v7
        with:
          name: linux-packages
          path: installers

      # Into the same directory, so the upload below stays one glob over
      # everything Linux produced rather than a list that has to be kept in step
      # with the jobs above.
      - name: Collect the Arch package
        uses: actions/download-artifact@v7
        with:
          name: arch-package
          path: installers

      # Same release, both platforms: a pushed tag now starts this workflow
      # and `windows-build.yml` together, and both release jobs race to be
      # the one that creates it. `gh release create` is not idempotent on its
      # own, so the loser of that race is left tolerated with `|| true`
      # rather than failing the job — by the time it runs, the release it
      # was about to create already exists, made by whichever workflow won,
      # and the upload immediately below still has a release to attach to
      # either way. The body is left empty for the reason `windows-build.yml`
      # gives: release notes are the owner's prose, and nothing here invents
      # any.
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "" --verify-tag || true
          fi
          gh release upload "$TAG" installers/* --clobber
