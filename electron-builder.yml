appId: dev.sudomegas.jadeite
productName: JADEITE
copyright: Copyright (C) sudo-megas

directories:
  output: release
  buildResources: build

# The mark, rasterised from build/icon.svg and committed beside it. The PNG is
# in the tree rather than generated by a prepack step so that packaging never
# depends on rsvg-convert or ImageMagick existing on the machine cutting the
# release. electron-builder derives the pacman and deb icon sets from it, and it
# also feeds the desktop entry below.
icon: build/icon.png

files:
  - out/**/*
  - package.json
  # Shipped inside the asar as well as consumed by the packager: the main
  # process hands this path to BrowserWindow for the window and taskbar icon,
  # and resolves it against app.getAppPath() so the one string is right in dev
  # (the project root) and packaged (inside app.asar).
  - build/icon.png

# Native modules must stay outside the asar so their .node binaries are loadable.
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3-multiple-ciphers/**"
  - "**/node_modules/argon2/**"

# The app never phones home: no publish provider, no update feed.
publish: null

linux:
  target:
    - pacman
    - deb
  category: Office
  synopsis: Secure personal wealth and possessions tracker
  desktop:
    entry:
      Name: JADEITE
      Terminal: false
      Type: Application
      Categories: Office;Finance;
