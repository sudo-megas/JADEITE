appId: dev.sudomegas.jadeite
productName: JADEITE
copyright: Copyright (C) sudo-megas

directories:
  output: release
  buildResources: build

# The launcher icon: the tile, cut square from build/outerAPP.png.
#
# Derived and committed rather than generated by a prepack step, so that
# packaging never depends on ImageMagick existing on the machine cutting the
# release. electron-builder derives the pacman and deb icon sets from this one
# file, and it also feeds the desktop entry below.
#
# Linux takes exactly one icon — `linuxOptions` exposes a single `icon`, and
# FpmTarget builds both packages from it — so the split docs/conficon.md asks
# for, the bare shield on installers and the tile in launchers, cannot be made
# here. It becomes expressible at Realisation XI, where NSIS has `installerIcon`
# and `uninstallerIcon`; until then the tile is what the desktop shows, since
# the launcher is the surface anybody actually looks at.
#
# The two masters are build/innerAPP.png and build/outerAPP.png, both carrying a
# real alpha channel. Everything square is cut from them the same way — floor
# the alpha, trim to content, pad the short axis to the long one, resize:
#
#     magick build/outerAPP.png -channel A -level 2%,100% +channel -trim +repage \
#       -set option:side "%[fx:max(w,h)]" -background none -gravity center \
#       -extent "%[side]x%[side]" -filter Lanczos -resize 512x512 build/icon.png
#
# Padding rather than cropping is the whole of it: neither master is square, and
# conficon.md's one hard rule is that the aspect ratio never changes.
icon: build/icon.png

files:
  - out/**/*
  - package.json
  # Shipped inside the asar as well as consumed by the packager: the main
  # process hands this path to BrowserWindow for the window and taskbar icon,
  # and resolves it against app.getAppPath() so the one string is right in dev
  # (the project root) and packaged (inside app.asar).
  - build/icon.png

  # Six patterns, two findings, both measured against the built artefact rather
  # than reasoned about. Nothing here removes a byte the running app can reach.
  #
  # **The renderer's libraries are in the asar twice.** `externalizeDepsPlugin()`
  # is applied to `main` and `preload` in electron.vite.config.ts and to nothing
  # else, so the renderer's Rollup build inlines what it imports: the packaged
  # chunk carries `ECharts`, `getZr`, `getCoreRowModel` and `flexRender` as
  # compiled code, and no `require('echarts')` survives anywhere in it.
  # electron-builder copies the packages regardless, because they are named in
  # `dependencies` and that is the only question it asks. 58 MB of echarts, the
  # 4.7 MB of zrender it draws through, 4.1 MB of @tanstack — 1271 of the
  # asar's 1769 entries — none of it ever loaded.
  #
  # They stay in `dependencies`, rather than being moved to `devDependencies`
  # which is the other way to reach this outcome. They are runtime libraries of
  # the application, bundled instead of resolved; calling them development
  # tooling to make a packager behave would be a lie told to a config file.
  - '!**/node_modules/echarts/**/*'
  - '!**/node_modules/zrender/**/*'
  - '!**/node_modules/@tanstack/**/*'

  # **The SQLite amalgamation ships twice, and the app compiles neither.**
  # `deps/sqlite3/sqlite3.c` is the C that better-sqlite3-multiple-ciphers was
  # built from; `build/Release/obj/` is what the compiler left behind on the way
  # to `build/Release/better_sqlite3.node`. 14 MB each. `src/` is the C++
  # binding source beside them. What the app loads is the `.node`, and it stays.
  #
  # Nothing else inside either native module is touched, and that restraint is
  # the point rather than timidity. argon2 resolves its binary through
  # node-gyp-build and better-sqlite3 through `bindings`, and both walk a list
  # of candidate paths at *require* time — so a package that looks equally dead
  # on paper (`prebuild-install`, `detect-libc`, `semver`, together under 1 MB)
  # could be one of those paths, and removing it would fail at unlock, on a
  # machine that never built the app, where no unit test is watching. Which is
  # why this list is verified by starting the packaged binary and opening every
  # section — `tests/package/packaged.spec.ts`, `npm run verify:package` — and
  # never by reading it back.
  - '!**/node_modules/better-sqlite3-multiple-ciphers/deps/**/*'
  - '!**/node_modules/better-sqlite3-multiple-ciphers/build/Release/obj/**/*'
  - '!**/node_modules/better-sqlite3-multiple-ciphers/src/**/*'

# Native modules must stay outside the asar so their .node binaries are loadable.
#
# **The Windows package must be built on Windows. This is not a preference.**
# `node-gyp-build` resolves in the order `build/Release`, `build/Debug`,
# `prebuilds` — the prebuild is a *fallback*, not a preference. Nothing under
# `argon2/` is pruned by the `files:` block above (better-sqlite3's build output
# is, at lines 81-83; the asymmetry is accidental), so whatever sits in
# `build/Release` at pack time is what ships. On this machine that file is an
# `ELF 64-bit LSB shared object`. Cross-pack a Windows installer from a Linux
# checkout and the packaged application will load that ELF in preference to
# `prebuilds/win32-x64/argon2.glibc.node`, and die with "%1 is not a valid Win32
# application" — *at first unlock*, after the vault UI has already painted,
# because `argon2` is only required inside the KDF. A green build, a shipped
# installer, and a failure the packaging never sees.
#
# Realisation XI therefore builds `--win` from a Windows checkout and `--linux`
# from a Linux one. `npm run package:win` exists to be run there.
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3-multiple-ciphers/**"
  - "**/node_modules/argon2/**"

# The app never phones home: no publish provider, no update feed.
publish: null

# The dependencies pacman is told to satisfy — three, and every one of them
# measured from the shipped binaries rather than accepted from a default.
#
# **electron-builder's default list makes the package uninstallable on Arch.**
# It is `[c-ares, ffmpeg, gtk3, http-parser, libevent, libvpx, libxslt, libxss,
# minizip, nss, re2, snappy, libnotify, libappindicator-gtk3]`, hardcoded in
# `FpmTarget`, and two of those names **no longer exist in the repositories**:
# `http-parser`, which Chromium replaced with llhttp years ago, and
# `libappindicator-gtk3`, superseded by the Ayatana fork. `pacman -U` does not
# warn about them — it refuses the transaction outright:
#
#     warning: cannot resolve "http-parser", a dependency of "jadeite"
#     error: failed to prepare transaction (could not satisfy dependencies)
#
# So the primary, installer-grade target could not be installed on the primary
# platform, and nothing in nine rungs of tests could have said so. It was found
# by the owner running `pacman -U`, which is the one instrument that reaches it,
# and it is the reason Realisation X's install boxes are owner-observed rather
# than machine-checked.
#
# **How these three were arrived at.** Every ELF object under `opt/JADEITE` was
# walked with `ldd`, the bundled libraries subtracted, and each remaining
# `.so` mapped to its owning package with `pacman -Qo` — 94 libraries, 68
# packages. Reducing that to the members nothing else in the set pulls in
# transitively leaves exactly three: gtk3 carries the whole GTK, X11, Wayland,
# cairo, pango and libcups tree beneath it, and nss carries nspr.
#
# **What `ldd` cannot see was checked separately**, because a dlopen leaves no
# entry in the dynamic table. The binary references `libnotify.so.4`,
# `libsecret-1.so.0`, `libcups.so.2`, `libpulse.so.0` and `libasound.so.2` as
# strings — Chromium's notification, keyring, printing and audio paths. None of
# the first four is declared, and the omission is a statement rather than an
# oversight: this application shows no notification, has no tray, plays no
# sound, and §16.1 forbids a printing pipeline outright. Declaring them would
# make the package demand libraries for features the specification prohibits.
# `libasound` is kept because it is also a load-time link, not only a dlopen.
# `libxss` is dropped for the opposite reason to the two dead names — it is a
# real package, and the binary never asks for it: Chromium stopped reading the
# X11 screensaver extension for idle time, which `src/main/idle.ts` gets from
# `powerMonitor` instead.
#
# The deb keeps electron-builder's defaults. They name real Debian packages, so
# that target is not broken, and they are over-generous in exactly the way
# described above — but correcting them means guessing Debian names with no
# Debian machine to test on, and an untested dependency list is what this
# comment exists to complain about.
pacman:
  depends:
    - gtk3
    - nss
    - alsa-lib
  # Realisation XI, closing a box carried from X. electron-builder passes fpm
  # `--after-install` and `--after-remove` and nothing else, which is whole for
  # the deb — dpkg runs `postinst configure` on an upgrade too — and short for
  # pacman, which calls `post_install` only on a first install and
  # `post_upgrade` when one version replaces another. Without this, `pacman -U`
  # over an installed JADEITE ran no scriptlet at all and the SUID bit
  # `post_install` puts on `chrome-sandbox` was silently lost, on precisely the
  # machines that need the helper. `pacman.fpm` is passed through verbatim, so
  # the file is read relative to the directory packaging runs from — the
  # project root, which is where npm puts a script's cwd. The scriptlet says
  # the rest.
  fpm:
    - --after-upgrade
    - build/pacman-post-upgrade.sh

# Realisation XI. The second platform, and the first one whose installer this
# project actually gets to choose the shape of.
#
# **The icon split promised at the top of this file becomes expressible here.**
# `docs/conficon.md` asks for two marks with different jobs — `innerAPP.png`, the
# bare shield, on installers, and `outerAPP.png`, the tile, in launchers. Linux
# could not honour it: `linuxOptions` exposes a single `icon` and `FpmTarget`
# builds both packages from it. NSIS takes four, so the shield goes on `setup.exe`
# and its uninstaller while the tile goes on the application, which is what the
# Start menu and the taskbar show. Both `.ico` files are committed rather than
# generated at pack time, for the reason the rest of this file gives — packaging
# must not need ImageMagick on the machine cutting the release — and both are cut
# with the same recipe as the hicolor set, so no mark is ever stretched:
#
#     for src in outerAPP:icon innerAPP:installerIcon; do
#       magick "build/${src%%:*}.png" -channel A -level 2%,100% +channel -trim +repage \
#         -set option:side "%[fx:max(w,h)]" -background none -gravity center \
#         -extent "%[side]x%[side]" -filter Lanczos \
#         -define icon:auto-resize=256,128,64,48,32,24,16 "build/${src##*:}.ico"
#     done
#
# Seven sizes in each, because Windows picks its own and rescales whatever it is
# given if the size it wants is absent. `uninstallerIcon` points at the same file
# as `installerIcon` instead of a second identical copy: the two are the same
# mark doing the same job, and a duplicated 372 KB in the repository would say
# they were not.
#
# **Unsigned, and that is a decision rather than an omission.** There is no code
# signing certificate, so SmartScreen will interpose a "Windows protected your
# PC" panel on first run until the download earns reputation. The alternative is
# an EV certificate rented annually from a vendor, for an application whose whole
# premise is that it phones nobody and belongs to its owner. The panel is
# dismissible; the dependency would not be.
win:
  target:
    - nsis
  # The tile — the mark a launcher shows, per conficon.md's ICON 2. This also
  # becomes the window and taskbar icon, which is the same surface by another
  # name.
  icon: build/icon.ico
  # `jadeite`, not `JADEITE`: the executable name is a filename, and every other
  # filename this project ships is lowercase — `jadeite.db`, `jadeite.keys`,
  # `jadeite-<version>.pacman`, `/opt/JADEITE/jadeite`. `productName` still carries
  # the capitals wherever a human reads it.
  executableName: jadeite

nsis:
  # The shield — conficon.md's ICON 1, the mark for installers.
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/installerIcon.ico
  installerHeaderIcon: build/installerIcon.ico

  # Assisted rather than one-click, which is not electron-builder's default.
  #
  # A one-click installer picks a directory, installs and launches, with no page
  # in between. That is right for something disposable. This application holds
  # the owner's financial record and asks for a password before it will show
  # anything, and the install is a thing they should be able to see the shape of
  # — where it is going, and that it is going somewhere they chose.
  oneClick: false
  allowToChangeInstallationDirectory: true

  # Per-user, so no UAC prompt and no administrator.
  #
  # The vault lives in `%LOCALAPPDATA%\jadeite` (§5.1, as amended by Realisation
  # XI — configuration stays in `%APPDATA%\jadeite`) and is per-user by
  # construction; a machine-wide install would put the binary somewhere every
  # account can reach while the data stayed in exactly one profile, which
  # promises a sharing that does not exist. It also means an owner without
  # administrator rights on their own machine can still install this.
  perMachine: false

  createDesktopShortcut: true
  createStartMenuShortcut: true
  # What the shortcut is called. `productName` would give the same string today;
  # naming it here means a later change to `productName` cannot silently rename
  # every existing shortcut on an upgrade.
  shortcutName: JADEITE

  # Removing the application must not remove the vault — the same rule the pacman
  # side is held to, and the one Realisation X called the rule that matters.
  # `%LOCALAPPDATA%\jadeite` is outside `$INSTDIR`, so NSIS does not touch it —
  # nor is `%APPDATA%\jadeite`, where the configuration is; this key
  # only stops electron-builder from volunteering to delete the Electron profile
  # beside it.
  deleteAppDataOnUninstall: false

  # `jadeite-<version>-setup.exe`, matching the lowercase, hyphenated shape of
  # `jadeite-<version>.pacman` rather than electron-builder's default
  # `JADEITE Setup <version>.exe`, which carries spaces into every download
  # directory and every command line that ever names it.
  artifactName: ${name}-${version}-setup.${ext}

linux:
  target:
    - pacman
    - deb
  # A prepared set rather than one 512px file, and the difference is visible.
  #
  # `LinuxTargetHelper.computeDesktopIcons` builds its source list as
  # `[linux.icon, config.icon]` and takes the first that resolves, so this key —
  # and not the top-level `icon:` — decides what lands in hicolor. (The
  # `buildResources/icons` fallback below it is only consulted when neither is
  # set, which is why the directory alone was not enough.) The top-level `icon:`
  # stays, because the main process still hands that one file to BrowserWindow.
  #
  # The gain is *not* resampling quality, and it was measured before it was
  # claimed: a 32px file cut from the master and a 32px Lanczos reduction of the
  # 512 are near indistinguishable, because both start from something large.
  # The gain is that hicolor gets an exact match at every size a launcher asks
  # for, so nothing is scaled at display time by whatever filter that particular
  # toolkit happens to use. Given one 512px file, electron-builder installs one
  # 512px file, and every waybar and application grid rescales it on its own
  # terms. Each file here is resampled from `build/outerAPP.png` directly:
  #
  #     for n in 16 24 32 48 64 96 128 256 512; do
  #       magick build/outerAPP.png -channel A -level 2%,100% +channel -trim +repage \
  #         -set option:side "%[fx:max(w,h)]" -background none -gravity center \
  #         -extent "%[side]x%[side]" -filter Lanczos -resize ${n}x${n} \
  #         -define png:color-type=6 -strip "build/icons/${n}x${n}.png"
  #     done
  #
  # The filenames carry the size because that is how electron-builder reads a
  # set. Committed rather than generated at pack time, for the reason the whole
  # of this file gives: packaging must not need ImageMagick on the machine
  # cutting the release.
  icon: build/icons
  # Both the main category and the additional one, here rather than under
  # `desktop.entry`. LinuxTargetHelper assigns Categories from this key *after*
  # merging the entry map, so an entry-level Categories is silently discarded —
  # which is how the shipped v0.9b packages came to read `Categories=Office;`
  # while this file appeared to ask for Finance as well.
  #
  # `Comment` is the same story — assigned after the merge, so only the manifest
  # can reach it. `Comment[tr]` is a *different* key and does survive, which is
  # where the Turkish tooltip below lives.
  category: Office;Finance;

  # The whole of what an Arch user sees. fpm hands `--description` the synopsis,
  # a newline and the manifest's description; deb.erb splits that into a short
  # line and an indented continuation, but pacman.erb writes `pkgdesc = <%=
  # description %>` on one line, so the second line becomes an orphan with no
  # `=` and pacman drops it. Verified against the shipped artefact: `.PKGINFO`
  # carries both lines and `pacman -Qip` prints only this one. So this string
  # must stand alone, and it is the one that has to carry the name.
  #
  # An em dash rather than a colon on purpose: `: ` inside a plain YAML scalar
  # would end the key.
  synopsis: Economy Journal — an encrypted record of income, payments and valuables

  desktop:
    entry:
      Name: JADEITE
      # Name is the application, GenericName is what kind of thing it is —
      # "Mozilla" and "Web Browser" in the spec's own example. This is the pair
      # a launcher shows and indexes, so it is where the rename actually lands.
      # `Name[tr]` is deliberately absent: `common.brand` is JADEITE in both
      # catalogues, and localising the brand here would contradict the app.
      GenericName: Economy Journal
      GenericName[tr]: Ekonomi Defteri
      # The tooltip, in the application's own section vocabulary (§13's Gelir &
      # Gider, Ödemeler, Varlıklar) so the launcher and the rail agree. §13 binds
      # what *JADEITE* may read; a desktop environment choosing this key is the
      # environment reading its own locale, which is not the same thing.
      Comment[tr]: Gelir, gider, ödeme ve varlıkları tek bir şifreli dosyada tutar
      Terminal: false
      Type: Application
